reconciliation_checks:
  bill_charge_missing_original_charge_ledger:
    description: Find Bill Charges without a positive original Charge ledger row.
    appsheet_expression: |
      COUNT(
        SELECT(
          Ledger[LedgerID],
          AND(
            [Bill Charge ID] = [_THISROW].[Row ID],
            [Type] = "Charge"
          )
        )
      ) = 0
  bill_charge_ledger_remaining_amount:
    appsheet_expression: |
      IF(
        SUM(
          SELECT(
            Ledger[Signed Amount],
            AND(
              [Bill Charge ID] = [_THISROW].[Row ID],
              ISNOTBLANK([Signed Amount])
            )
          )
        ) > 0,
        SUM(
          SELECT(
            Ledger[Signed Amount],
            AND(
              [Bill Charge ID] = [_THISROW].[Row ID],
              ISNOTBLANK([Signed Amount])
            )
          )
        ),
        0
      )
  loan_payment_expected_rows:
    expected:
      PaymentAllocations: 2
      Interest_Debt_Charge: 1
      Ledger_Rows: 3
    ledger_rows:
      - +Interest Charge
      - -Interest Payment
      - -Principal Applied

known_issues:
  - area: Bots
    issue: Some flows may double-fire without strong gating/idempotency.
  - area: Ledger
    issue: Legacy full-payment debt ledger rows can double-count principal if split ledgers also exist.
  - area: Loans
    issue: Interest charges can duplicate if both Loan_Pmt_Splits and PaymentAllocations create charges.
  - area: Statements
    issue: Payments/reversals may belong to different statement periods.
  - area: Formulas
    issue: Circular dependencies can occur in bill cycle logic.
  - area: Performance
    issue: Debug Log rows and repeated SELECT() formulas can slow sync.
  - area: Cross-App
    issue: MedRecord, Armoury, and ReceiptKeeper are less optimized than CashSnap.
  - area: Entity System
    issue: Organization/entity model needs redesign.

